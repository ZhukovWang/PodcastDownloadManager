name: .NET Core

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:

    strategy:
      # Report both platforms even when one of them fails.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # The test project is an xunit v3 / Microsoft.Testing.Platform executable, so running it
    # directly is the test run. `dotnet test` would drive the same executable, but it needs a named
    # pipe between the SDK and the test process, which some locked-down machines deny.
    - name: Test
      run: >-
        dotnet run --project PodcastDownloadManager.Tests
        --configuration Release --no-build --no-restore
